<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Meta tags para definir o conjunto de caracteres e a viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da página que aparece na aba do navegador -->
    <title>Receitas do MasterChef</title>
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Cabeçalho da página -->
    <header>
        <!-- Título principal da página -->
        <h1>Receitas do MasterChef</h1>
    </header>
    
    <!-- Conteúdo principal da página -->
    <main>
        <!-- Seção de busca -->
        <section class="search-section">
            <!-- Campo de entrada para busca de receitas -->
            <input type="search" placeholder="Busque sua receita" aria-label="Buscar receita">
            <!-- Botão para iniciar a busca -->
            <button type="button">Pesquisar</button>
        </section>
        
        <!-- Seção onde serão exibidos os resultados da busca -->
        <section class="resultados-pesquisa">
            <!-- As receitas são carregadas aqui pelo app.js, a partir do dados.js -->
        </section>
    </main>
    
    <!-- Rodapé da página -->
    <footer>
        <p>&copy; 2024 - Todos os direitos reservados</p>
    </footer>
    
    <!-- Scripts JavaScript -->
    <script src="dados.js"></script>
    <script src="app.js"></script>
</body>
</html>
